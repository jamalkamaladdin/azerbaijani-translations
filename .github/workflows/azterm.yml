name: azterm
on:
  pull_request:
    paths: ["terms/**", "tools/azterm.py"]
  push:
    branches: [main]
    paths: ["terms/**", "tools/azterm.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/azterm.py check
      - name: dist/ is in step with terms/
        run: |
          python3 tools/azterm.py build
          git diff --exit-code -- dist
